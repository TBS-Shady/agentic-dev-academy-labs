name: Lab
description: A hands-on lab to build and document
title: "[Lab] "
labels: ["lab"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the lab should show or teach.
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Exam topic
      description: Which part of the exam this covers.
  - type: textarea
    id: needs
    attributes:
      label: Needs
      description: Tools, services or accounts required.
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] Lab runs from its README
        - [ ] Findings written up
        - [ ] Cloud resources torn down
