name: Task
description: A to-do, fix, documentation update or other piece of work
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Context or the problem this solves.
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
