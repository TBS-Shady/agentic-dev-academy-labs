# Local checks that run before every commit.
# Setup (once per clone):  pipx install pre-commit   then   pre-commit install
# Run on everything:       pre-commit run --all-files
# Update hook versions:    pre-commit autoupdate
# labs/companion/ holds third-party code copied as-is, so the file fixers skip it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^labs/companion/alex/assets/
      - id: detect-private-key
      - id: check-yaml
        exclude: ^labs/companion/
      - id: check-json
        exclude: ^labs/companion/
      - id: end-of-file-fixer
        exclude: ^labs/companion/
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: ^labs/companion/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
